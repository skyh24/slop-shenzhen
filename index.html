  <!-- Top-Right Toolbar: Time of Day, Teleport, Map & Clean View -->
  <div class="hud hud-top-right">
    <div id="hud-toolbar" class="panel toolbar">
      <div class="time-switch" role="group" data-label="ui.timeGroup">
        <button id="time-golden" class="time-btn active" data-time="golden" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-golden"/></svg><span class="seg-label"></span>
        </button>
        <button id="time-midday" class="time-btn" data-time="midday" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="seg-label"></span>
        </button>
        <button id="time-twilight" class="time-btn" data-time="twilight" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-twilight"/></svg><span class="seg-label"></span>
        </button>
        <button id="time-midnight" class="time-btn" data-time="midnight" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="seg-label"></span>
        </button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-teleport" class="tool-btn" type="button" popovertarget="teleport-popover" data-tip="ui.teleportTitle" data-label="ui.teleportTitle">

      </button>

        <svg class="icon" aria-hidden="true"><use href="#i-apec"/></svg><span class="tool-label" data-text="apecTheme.label"></span>
      </button>
      <button id="btn-open-map" class="tool-btn" type="button" data-tip="ui.openMap" data-label="ui.map" aria-keyshortcuts="M">
        <svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="tool-label" data-text="ui.map"></span><kbd>M</kbd>
      </button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-sound" class="tool-btn icon-only" type="button" data-label="ui.muteSound" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg>
      </button>
      <button id="btn-toggle-hud" class="tool-btn icon-only" type="button" data-tip="ui.hideHudKey" data-label="ui.hideHud" aria-pressed="false">

      </button>

        <div class="gauge-meter" aria-hidden="true"><span id="hud-speed-meter"></span></div>

      <div id="camera-switch" class="camera-switch">
        <button id="cam-prev" class="icon-btn" type="button" data-tip="ui.previousCamera" data-label="ui.previousCamera">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <button id="cam-menu-btn" class="camera-current" type="button" popovertarget="camera-popover" data-tip="ui.cameraMenu">
          <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span id="hud-active-camera" data-text="cameraNames.chase"></span><kbd>V</kbd>
        </button>
        <button id="cam-next" class="icon-btn" type="button" data-tip="ui.nextCameraKey" data-label="ui.nextCamera">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Touch input stays available in clean view; the map temporarily suspends it. -->
  <section id="touch-controls" data-label="ui.touch" hidden>
    <div class="touch-movement">
      <div id="touch-stick" role="group" data-label="ui.joystick">
        <span class="touch-stick-axis" aria-hidden="true"></span>
        <span id="touch-stick-knob" aria-hidden="true"></span>
      </div>
      <span class="touch-caption" data-text="ui.movement"></span>
    </div>
    <p class="touch-look-hint" data-text="ui.touchLook"></p>
    <div class="touch-actions" role="group" data-label="ui.touchActions">
      <button class="touch-action" data-touch-action="up" type="button" data-label="touchActions.jump" aria-pressed="false" hidden>
        <span aria-hidden="true">↑</span><span data-touch-label="up" data-text="touchActions.jump"></span>
      </button>
      <button class="touch-action" data-touch-action="down" type="button" data-label="touchActions.descend" aria-pressed="false" hidden>
        <span aria-hidden="true">↓</span><span data-touch-label="down" data-text="touchActions.descend"></span>
      </button>
    </div>
  </section>

  <!-- 跟随、取景及自动航拍机位 -->
  <div id="camera-popover" class="popover" popover data-side="above" data-anchor="hud-cluster" data-align="hud-cluster" data-label="ui.cameras">
    <div class="pop-title" data-text="ui.followCameras"></div>
    <button id="cam-chase" class="pop-item cam-btn active" data-camera="chase" type="button"><span class="pop-name"></span><kbd>5</kbd></button>
    <button id="cam-action" class="pop-item cam-btn" data-camera="action" type="button"><span class="pop-name"></span><kbd>6</kbd></button>
    <button id="cam-pov" class="pop-item cam-btn" data-camera="pov" type="button"><span class="pop-name"></span><kbd>7</kbd></button>
    <div class="pop-title" data-text="ui.scenicCameras"></div>
    <button id="cam-centralPark" class="pop-item cam-btn" data-camera="centralPark" type="button"><span class="pop-name"></span></button>
    <button id="cam-fifthAve" class="pop-item cam-btn" data-camera="fifthAve" type="button"><span class="pop-name"></span><kbd>8</kbd></button>
    <button id="cam-timesSquare" class="pop-item cam-btn" data-camera="timesSquare" type="button"><span class="pop-name"></span><kbd>9</kbd></button>
    <button id="cam-chryslerGCT" class="pop-item cam-btn" data-camera="chryslerGCT" type="button"><span class="pop-name"></span><kbd>0</kbd></button>
    <button id="cam-observatory" class="pop-item cam-btn" data-camera="observatory" type="button"><span class="pop-name"></span></button>
    <button id="cam-bryantPark" class="pop-item cam-btn" data-camera="bryantPark" type="button"><span class="pop-name"></span></button>
    <button id="cam-waterfront" class="pop-item cam-btn" data-camera="waterfront" type="button"><span class="pop-name"></span></button>
    <button id="cam-drone" class="pop-item cam-btn" data-camera="drone" type="button"><span class="pop-name"></span></button>
    <button id="cam-djiSkyCity" class="pop-item cam-btn" data-camera="djiSkyCity" type="button"><span class="pop-name"></span></button>
    <button id="cam-pingAnTower" class="pop-item cam-btn" data-camera="pingAnTower" type="button"><span class="pop-name"></span></button>
    <button id="cam-chunsunTower" class="pop-item cam-btn" data-camera="chunsunTower" type="button"><span class="pop-name"></span></button>
    <button id="cam-civicRoof" class="pop-item cam-btn" data-camera="civicRoof" type="button"><span class="pop-name"></span></button>
    <button id="cam-chunjianShell" class="pop-item cam-btn" data-camera="chunjianShell" type="button"><span class="pop-name"></span></button>
    <button id="cam-cultureSquare" class="pop-item cam-btn" data-camera="cultureSquare" type="button"><span class="pop-name"></span></button>
    <button id="cam-conventionCenter" class="pop-item cam-btn" data-camera="conventionCenter" type="button"><span class="pop-name"></span></button>
    <button id="cam-upperhills" class="pop-item cam-btn" data-camera="upperhills" type="button"><span class="pop-name"></span></button>
    <button id="cam-nonferrousTower" class="pop-item cam-btn" data-camera="nonferrousTower" type="button"><span class="pop-name"></span></button>
    <button id="cam-iecXiangmihu" class="pop-item cam-btn" data-camera="iecXiangmihu" type="button"><span class="pop-name"></span></button>
    <button id="cam-superHq" class="pop-item cam-btn" data-camera="superHq" type="button"><span class="pop-name"></span></button>
    <button id="cam-bayBridge" class="pop-item cam-btn" data-camera="bayBridge" type="button" hidden><span class="pop-name"></span></button>
  </div>

  <!-- 全屏地图（M） -->
  <section id="fullmap-modal" class="fullmap-modal hidden" role="dialog" aria-modal="true" data-label="ui.mapTitle">
    <div id="fullmap-canvas-wrap" class="fullmap-canvas-wrap">
      <canvas id="fullmap-canvas"></canvas>
    </div>

    <div class="fullmap-header">
      <div class="panel fullmap-title">
        <span class="mta-bullet" aria-hidden="true" data-text="ui.badge"></span>
        <div>
          <h2 data-text="ui.mapTitle"></h2>
          <p id="fullmap-player-info" class="fullmap-subtitle"></p>
        </div>
      </div>
      <label class="panel fullmap-search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="fullmap-search" class="fullmap-search" type="text" data-label="ui.search" autocomplete="off" spellcheck="false" />
      </label>
      <button id="close-fullmap-btn" class="panel tool-btn fullmap-close" type="button" data-tip="ui.closeMap">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="tool-label" data-text="ui.close"></span><kbd>Esc</kbd>
      </button>
    </div>

    <div class="map-controls">
      <div class="panel map-compass" data-tip="ui.trueNorth">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <g id="map-compass-needle">
            <path d="M22 9.5 25.6 22h-7.2z" fill="#f05a4f"/>
            <path d="M22 34.5 25.6 22h-7.2z" fill="rgba(255,255,255,0.72)"/>
            <text x="22" y="8" text-anchor="middle" data-text="ui.north"></text>
          </g>
        </svg>
      </div>
      <div class="panel map-zoom">
        <button id="map-zoom-in" class="icon-btn" type="button" data-tip="ui.zoomIn" data-label="ui.zoomIn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="map-zoom-out" class="icon-btn" type="button" data-tip="ui.zoomOut" data-label="ui.zoomOut"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <div class="panel map-zoom">
        <button id="map-center-player" class="icon-btn" type="button" data-tip="ui.centerPlayer" data-label="ui.centerPlayer"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        <button id="map-view-all" class="icon-btn" type="button" data-tip="ui.fitMap" data-label="ui.fitMap"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
      <div class="panel map-zoom">
        <button id="map-metro" class="icon-btn" type="button" popovertarget="metro-popover" data-tip="metro.title" data-label="metro.title"><svg class="icon" aria-hidden="true"><use href="#i-metro"/></svg></button>
        <button id="map-hsr" class="icon-btn" type="button" aria-pressed="false" data-tip="hsr.title" data-label="hsr.title"><svg class="icon" aria-hidden="true"><use href="#i-rail"/></svg></button>
        <button id="map-drones" class="icon-btn" type="button" aria-pressed="false" data-tip="drones.title" data-label="drones.title"><svg class="icon" aria-hidden="true"><use href="#i-drone"/></svg></button>
        <button id="map-plan-drive" class="icon-btn" type="button" aria-pressed="false" aria-controls="map-drive-panel" data-tip="drive.plan" data-label="drive.plan"><svg class="icon" aria-hidden="true"><use href="#i-car"/></svg></button>
      </div>
    </div>

    <div id="metro-popover" class="popover" popover data-side="above" data-label="metro.title">
      <div class="pop-title" data-text="metro.title"></div>
      <div class="metro-actions">
        <button id="metro-show-all" class="pop-item" type="button" data-text="metro.all" data-label="metro.all"></button>
        <button id="metro-hide-all" class="pop-item" type="button" data-text="metro.none" data-label="metro.none"></button>
      </div>
      <div id="metro-lines"></div>
    </div>

    <section id="map-drive-panel" class="panel map-drive-panel" data-label="drive.plan" hidden>
      <strong data-text="drive.plan"></strong>
      <p id="map-drive-status" role="status"></p>
      <div class="map-drive-actions">
        <button id="map-drive-clear" class="tool-btn" type="button" data-text="drive.clear"></button>
        <button id="map-drive-to-start" class="tool-btn" type="button" data-text="drive.toStart" hidden></button>
        <button id="map-drive-start" class="tool-btn" type="button" data-text="drive.start" hidden></button>
        <button id="map-drive-stop" class="tool-btn" type="button" data-text="drive.stop" hidden></button>
      </div>
    </section>

    <div class="fullmap-footer">
      <div class="panel fullmap-status">
        <span id="fullmap-hover-info" data-text="map.clickHint"></span>
      </div>
    </div>

    <div class="panel fullmap-legend">
      <span class="legend-item"><span class="legend-swatch player-swatch"></span><span data-text="ui.mapPlayer"></span></span>
      <span class="legend-item"><span class="legend-swatch landmark-swatch"></span><span data-text="ui.mapLandmark"></span></span>
      <span class="legend-item"><span class="legend-swatch gps-swatch"></span><span data-text="ui.mapWaypoint"></span></span>
      <span class="legend-item"><span class="legend-swatch bridge-swatch"></span><span data-text="ui.mapHighway"></span></span>
      <span id="fullmap-counts" class="legend-counts"></span>
    </div>
  </section>

</body>
</html>
